<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hannover City Challenge – Eilenriede & List</title>
<style>
:root{--bg:#0b1220;--panel:#111827;--panel2:#0f172a;--border:#334155;--text:#f8fafc;--muted:#cbd5e1;--accent:#22c55e;--accent2:#38bdf8;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0b1220,#111827);color:var(--text)}
main{max-width:720px;margin:0 auto;padding:18px 14px 40px}
.card{background:rgba(17,24,39,.97);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:14px}
h1,h2,h3{margin-top:0} h1{font-size:1.8rem} p{line-height:1.55}
label{display:block;font-size:.92rem;color:var(--muted);margin:12px 0 6px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #475569;background:#0f172a;color:white;font-size:1rem}
button{border:0;border-radius:14px;padding:13px 16px;font-size:1rem;font-weight:750;cursor:pointer;min-height:46px}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--accent);color:#052e16}.secondary{background:var(--accent2);color:#082f49}.ghost{background:#334155;color:var(--text)}.warn{background:var(--warn);color:#451a03}.danger{background:var(--bad);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#273449;color:#dbeafe;font-size:.84rem;font-weight:700;margin:0 6px 6px 0}
.progress{height:10px;background:#263244;border-radius:999px;overflow:hidden;margin:10px 0 18px}.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.mission{background:var(--panel2);border:1px solid #263244;border-radius:16px;padding:16px;margin:14px 0}
.status{margin-top:14px;padding:14px;border-radius:14px;border:1px solid var(--border);background:#0b1220}
.status.ok{border-color:#15803d;background:#052e16}.status.bad{border-color:#991b1b;background:#450a0a}.status.info{border-color:#0369a1;background:#082f49}
.small{font-size:.9rem;color:var(--muted)}.big{font-size:1.2rem;font-weight:800}.hidden{display:none}
details{margin-top:14px;background:#111827;border:1px solid #334155;border-radius:12px;padding:10px 12px}summary{cursor:pointer;font-weight:700}
.route-list{margin:8px 0 0;padding-left:20px;color:var(--muted)}.route-list li{margin:6px 0}
.footer{text-align:center;color:#94a3b8;font-size:.82rem;margin-top:24px}hr{border:0;border-top:1px solid #334155;margin:18px 0}
</style>
</head>
<body>
<main>
<div id="app"></div>
<div class="footer">Hannover City Challenge · Eilenriede & List · Prototyp</div>
</main>
<script>
const START={name:"Hochschule für Musik, Theater und Medien Hannover",text:"Treffpunkt: Hochschule für Musik, Theater und Medien Hannover / Eingang zur Eilenriede"};
const TARGETS=[
{name:"Burckhardt-Denkmal",lat:52.38000,lon:9.75750,radius:75,hintA:"Bleibt zunächst in der Eilenriede. Gesucht wird ein Denkmal nahe eines kleinen Teichs.",hintB:"Der gesuchte Mann war Forstmann. Sein Denkmal steht nicht weit vom südlichen Eingang der Eilenriede.",questionA:"Hinter der Musikhochschule beginnt der Wald. Findet dort einen Mann, der sein Berufsleben den Bäumen widmete. Sein Denkmal wartet nahe einem kleinen Teich.",questionB:"Euer erster Gesuchter war ein bedeutender Forstmann. Er steht heute still im Stadtwald und blickt seit dem 19. Jahrhundert auf Spaziergänger."},
{name:"Wilhelm-Busch-Wiese",lat:52.38280,lon:9.76049,radius:85,hintA:"Max und Moritz würden euch beim Namen helfen.",hintB:"Gesucht ist keine Statue, sondern eine Wiese.",questionA:"Sucht eine grüne Fläche im Wald, die nach dem Erfinder von Max und Moritz benannt ist.",questionB:"Ein berühmter Zeichner und Dichter gab dieser Wiese ihren Namen. Zwei seiner bekanntesten Figuren waren ziemlich schlechte Vorbilder."},
{name:"Wakitu",lat:52.38768,lon:9.75452,radius:80,hintA:"Es ist ein großer Spielplatz an der Hohenzollernstraße.",hintB:"Der Name besteht aus sechs Buchstaben und beginnt mit W.",questionA:"Findet einen Ort am Waldrand, dessen Name fast nach Abenteuerlager klingt. Eigentlich ist er einer der bekanntesten Spielplätze Hannovers.",questionB:"Kinder kennen diesen Ort vermutlich besser als Erwachsene: ein großer Spielplatz am Rand der Eilenriede mit einem ungewöhnlich kurzen Namen."},
{name:"Lister Turm",lat:52.38972,lon:9.75556,radius:70,hintA:"Das Gebäude liegt an der Walderseestraße 100.",hintB:"Im Namen steckt ein Stadtteil und ein Bauwerk.",questionA:"Verlasst langsam den Wald. Gesucht wird ein historisches Gebäude, dessen Name aus einem Hannoveraner Stadtteil und einem hohen Bauwerk besteht.",questionB:"Findet ein Stadtteilzentrum von 1895. Sein Name klingt, als könne man von dort weit über die List schauen."},
{name:"Bahlsen Stammhaus",lat:52.38948,lon:9.75202,radius:65,hintA:"Sucht an der Podbielskistraße 11.",hintB:"Ein ziemlich berühmter Keks bringt euch auf die richtige Firma.",questionA:"Zwei ziemlich kräftige Männer halten hier etwas fest, das normalerweise besser zu Kaffee als zu Architektur passt. Findet den Ort.",questionB:"Findet den Hannoveraner Firmensitz, an dem ein riesiger goldener Keks schon einmal für erstaunlich viel Aufregung gesorgt hat."},
{name:"Vietal Kitchen",lat:52.384759,lon:9.747142,radius:65,hintA:"Lister Meile 46.",hintB:"Vietnamesische Küche auf der Lister Meile.",questionA:"Finale! Sucht auf der Lister Meile die Hausnummer 46. Dort endet eure Rallye bei vietnamesischer Küche.",questionB:"Euer letztes Ziel beginnt mit „Vi“, liegt auf Hannovers bekannter Meile und dürfte inzwischen ziemlich gut riechen."}
];
const DEMO_USERS={"team-a":{password:"demo",team:"A"},"team-b":{password:"demo",team:"B"}};
const KEY="hannover_eilenriede_rallye_v1";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{loggedIn:false,username:null,team:null,step:0,hints:0,attempts:0,demoMode:false,simulateWrong:false,passed:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function newState(){return{loggedIn:false,username:null,team:null,step:0,hints:0,attempts:0,demoMode:false,simulateWrong:false,passed:{}}}
function resetAll(){localStorage.removeItem(KEY);state=newState();render()}
function login(){const u=document.getElementById("username").value.trim().toLowerCase();const p=document.getElementById("password").value;const user=DEMO_USERS[u];const box=document.getElementById("loginStatus");if(!user||user.password!==p){box.className="status bad";box.innerHTML="<strong>❌ Login fehlgeschlagen.</strong><br>Demo: team-a / demo oder team-b / demo";return}state=newState();state.loggedIn=true;state.username=u;state.team=user.team;save();render()}
function rad(v){return v*Math.PI/180}
function distanceMeters(a,b,c,d){const R=6371000;const dLat=rad(c-a),dLon=rad(d-b);const x=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLon/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function currentTarget(){return TARGETS[state.step]}
function questionFor(target){return state.team==="A"?target.questionA:target.questionB}
function hintFor(target){return state.team==="A"?target.hintA:target.hintB}
function checkLocation(){const target=currentTarget();const status=document.getElementById("status");const btn=document.getElementById("checkBtn");state.attempts++;save();btn.disabled=true;status.className="status info";status.innerHTML="📡 Standort wird geprüft …";if(state.demoMode){setTimeout(()=>{if(state.simulateWrong)showWrong();else showCorrect();btn.disabled=false},350);return}if(!navigator.geolocation){status.className="status bad";status.innerHTML="<strong>❌ Standortabfrage nicht verfügbar.</strong>";btn.disabled=false;return}navigator.geolocation.getCurrentPosition(pos=>{const dist=distanceMeters(pos.coords.latitude,pos.coords.longitude,target.lat,target.lon);const radius=Math.max(target.radius,Math.min(110,pos.coords.accuracy||0));if(dist<=radius)showCorrect();else showWrong();btn.disabled=false},err=>{let msg="Standort konnte nicht geprüft werden.";if(err.code===1)msg="Standortfreigabe wurde abgelehnt.";if(err.code===2)msg="Der Standort ist momentan nicht verfügbar.";if(err.code===3)msg="Die Standortabfrage hat zu lange gedauert.";status.className="status bad";status.innerHTML="<strong>❌ "+msg+"</strong><br><span class='small'>Für den echten Einsatz die Seite über HTTPS bereitstellen.</span>";btn.disabled=false},{enableHighAccuracy:true,timeout:12000,maximumAge:0})}
function showCorrect(){state.passed[state.step]=true;save();const target=currentTarget();const status=document.getElementById("status");status.className="status ok";status.innerHTML="<strong>✅ Richtig!</strong><br>Ihr habt den gesuchten Ort gefunden.";const reveal=document.getElementById("reveal");reveal.classList.remove("hidden");reveal.innerHTML="<strong>Auflösung:</strong> "+target.name;document.getElementById("nextBtn").classList.remove("hidden")}
function showWrong(){const status=document.getElementById("status");status.className="status bad";status.innerHTML="<strong>❌ Falsch.</strong><br>Das ist noch nicht der gesuchte Ort. Weiter suchen."}
function useHint(){const key="hint_"+state.team+"_"+state.step;if(!state[key]){state[key]=true;state.hints++;save()}const hb=document.getElementById("hintBox");hb.classList.remove("hidden");hb.innerHTML="💡 "+hintFor(currentTarget())}
function nextStation(){if(!state.passed[state.step])return;state.step++;save();render()}
function renderLogin(){return `<section class="card"><span class="badge">90-Minuten-Prototyp</span><h1>🌲 Hannover City Challenge</h1><p>Von der Eilenriede durch die List bis zum Vietal.</p><div class="mission"><strong>Startpunkt</strong><p>${START.text}</p><p class="small">Die erste Mission beginnt direkt nach dem Login.</p></div><label for="username">Benutzername</label><input id="username" autocomplete="username" placeholder="team-a"><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" placeholder="demo"><div class="row" style="margin-top:14px"><button class="primary" id="loginBtn">Einloggen</button></div><div id="loginStatus" class="status info"><strong>Demo-Zugänge</strong><br>team-a / demo<br>team-b / demo</div><details><summary>Route für die Orga</summary><ol class="route-list"><li>Start: Musikhochschule / Eilenriede</li><li>Burckhardt-Denkmal</li><li>Wilhelm-Busch-Wiese</li><li>Wakitu</li><li>Lister Turm</li><li>Bahlsen Stammhaus</li><li>Ziel: Vietal Kitchen</li></ol><p class="small">Im echten Spiel würde ich diese Übersicht natürlich nicht den Teams zeigen.</p></details></section>`}
function renderFinished(){return `<section class="card"><span class="badge">Team ${state.team}</span><h1>🏁 Geschafft!</h1><p class="big">Ihr habt alle ${TARGETS.length} Ziele gefunden.</p><div class="mission"><h3>🍜 Willkommen am Ziel</h3><p>Jetzt rein ins Vietal, etwas essen und die Geschichten der anderen Route vergleichen.</p></div><p>Standortprüfungen: <strong>${state.attempts}</strong><br>Hinweise genutzt: <strong>${state.hints}</strong></p><button class="danger" id="resetBtn">Prototyp zurücksetzen</button></section>`}
function renderGame(){const target=currentTarget();const progress=Math.round((state.step/TARGETS.length)*100);const hintUsed=!!state["hint_"+state.team+"_"+state.step];const already=!!state.passed[state.step];return `<section class="card"><span class="badge">Team ${state.team}</span><span class="badge">Mission ${state.step+1}/${TARGETS.length}</span><span class="badge">${state.hints} Hinweis${state.hints===1?"":"e"}</span><div class="progress"><div style="width:${progress}%"></div></div><h1>🧭 Findet den Ort</h1><div class="mission"><h3>Mission ${state.step+1}</h3><p>${questionFor(target)}</p></div><button class="primary" id="checkBtn">📍 Standort prüfen</button><div id="status" class="status ${already?"ok":"info"}">${already?"<strong>✅ Diese Station wurde bereits gefunden.</strong>":"Lauft zum vermuteten Ziel und tippt dort auf <strong>Standort prüfen</strong>."}</div><div id="reveal" class="status ${already?"":"hidden"}">${already?"<strong>Auflösung:</strong> "+target.name:""}</div><div class="row" style="margin-top:12px"><button class="warn" id="hintBtn">💡 Hinweis</button><button class="secondary ${already?"":"hidden"}" id="nextBtn">${state.step===TARGETS.length-1?"🏁 Rallye abschließen":"Nächste Mission →"}</button></div><div id="hintBox" class="status ${hintUsed?"":"hidden"}">${hintUsed?"💡 "+hintFor(target):""}</div><details><summary>🧪 Prototyp testen</summary><label style="display:flex;gap:10px;align-items:center;margin-top:12px"><input id="demoMode" type="checkbox" style="width:auto" ${state.demoMode?"checked":""}><span>GPS-Treffer simulieren</span></label><label style="display:flex;gap:10px;align-items:center"><input id="simulateWrong" type="checkbox" style="width:auto" ${state.simulateWrong?"checked":""}><span>Absichtlich „Falsch“ simulieren</span></label><p class="small">Damit kannst du die komplette Route durchspielen, ohne in Hannover zu sein.</p></details><details><summary>Orga-Info zu dieser Station</summary><p class="small"><strong>${target.name}</strong><br>GPS-Radius im Prototyp: ${target.radius} m</p></details><hr><button class="ghost" id="resetBtn">Abmelden / zurücksetzen</button></section>`}
function render(){const app=document.getElementById("app");if(!state.loggedIn){app.innerHTML=renderLogin();document.getElementById("loginBtn").addEventListener("click",login);document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});return}if(state.step>=TARGETS.length){app.innerHTML=renderFinished();document.getElementById("resetBtn").addEventListener("click",resetAll);return}app.innerHTML=renderGame();document.getElementById("checkBtn").addEventListener("click",checkLocation);document.getElementById("hintBtn").addEventListener("click",useHint);document.getElementById("nextBtn").addEventListener("click",nextStation);document.getElementById("resetBtn").addEventListener("click",resetAll);document.getElementById("demoMode").addEventListener("change",e=>{state.demoMode=e.target.checked;save()});document.getElementById("simulateWrong").addEventListener("change",e=>{state.simulateWrong=e.target.checked;save()})}
render();
</script>
</body>
</html>
