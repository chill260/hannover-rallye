<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hannover City Challenge</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--bg:#0b1220;--panel:#111827;--panel2:#0f172a;--border:#334155;--text:#f8fafc;--muted:#cbd5e1;--accent:#22c55e;--accent2:#38bdf8;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0b1220,#111827);color:var(--text)}
main{max-width:780px;margin:0 auto;padding:18px 14px 40px}
.card{background:rgba(17,24,39,.97);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:14px}
h1,h2,h3{margin-top:0} h1{font-size:1.8rem} p{line-height:1.55}
label{display:block;font-size:.92rem;color:var(--muted);margin:12px 0 6px}
input,textarea,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #475569;background:#0f172a;color:white;font-size:1rem;font-family:inherit}
textarea{min-height:105px;resize:vertical}
button{border:0;border-radius:14px;padding:13px 16px;font-size:1rem;font-weight:750;cursor:pointer;min-height:46px}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--accent);color:#052e16}.secondary{background:var(--accent2);color:#082f49}.ghost{background:#334155;color:var(--text)}.warn{background:var(--warn);color:#451a03}.danger{background:var(--bad);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:0 1 auto}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#273449;color:#dbeafe;font-size:.84rem;font-weight:700;margin:0 6px 6px 0}
.mission{background:var(--panel2);border:1px solid #263244;border-radius:16px;padding:16px;margin:14px 0}
.status{margin-top:14px;padding:14px;border-radius:14px;border:1px solid var(--border);background:#0b1220}
.status.ok{border-color:#15803d;background:#052e16}.status.bad{border-color:#991b1b;background:#450a0a}.status.info{border-color:#0369a1;background:#082f49}
.small{font-size:.9rem;color:var(--muted)}.big{font-size:1.2rem;font-weight:800}.hidden{display:none}
.footer{text-align:center;color:#94a3b8;font-size:.82rem;margin-top:24px}hr{border:0;border-top:1px solid #334155;margin:18px 0}
.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.admin-tabs button.active{background:var(--accent);color:#052e16}
.admin-list{display:grid;gap:8px}.admin-item{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:12px;cursor:pointer}.admin-item.active{border-color:var(--accent)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin:8px 0}.option-row input[type=radio]{width:auto}
#stationMap{height:360px;border-radius:16px;overflow:hidden;border:1px solid #334155;margin-top:12px}
@media(max-width:620px){.two-col{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>
<body>
<main>
<div id="app"></div>
<div class="footer">Hannover City Challenge · Live</div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
<script src="game.js"></script>
</body>
</html>
